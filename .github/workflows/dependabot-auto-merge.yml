name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  call-workflow-dependabot-auto-merge:
    uses: MiraGeoscience/CI-tools/.github/workflows/reusable-dependabot-auto-merge.yml@35a0e2ef34f63efb628b2d3522bfcda12c61564e # v3.13.4
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      checks: read
    with:
      dependabot-groups: mirageo-ci-tools,pre-commit-hooks
