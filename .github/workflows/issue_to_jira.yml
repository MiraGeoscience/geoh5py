name: Create JIRA issue

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  call-workflow-create-jira-issue:
    uses: MiraGeoscience/CI-tools/.github/workflows/reusable-jira-issue_to_jira.yml@4a000ba323d8818b874c907dd7cfb3b29960cba4 # v4.1.0
    permissions:
      contents: read
      issues: write
    with:
      project-key: 'GEOPY'
      components: '[{"name": "geoh5py"}]'
    secrets:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN_WRITE }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL_WRITE }}
