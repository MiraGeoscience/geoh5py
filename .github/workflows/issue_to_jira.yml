name: Create JIRA issue

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  call-workflow-create-jira-issue:
    uses: MiraGeoscience/CI-tools/.github/workflows/reusable-jira-issue_to_jira.yml@35a0e2ef34f63efb628b2d3522bfcda12c61564e # v3.13.4
    permissions:
      contents: read
      issues: write
    with:
      project-key: 'GEOPY'
      components: '[{"name": "geoh5py"}]'
    secrets:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN_WRITE }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL_WRITE }}
